[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/debug_window",
    "crates/loop_manager",
    "crates/main_window",
    "crates/play_core"
]

[workspace.dependencies]
log = "0.4.34"
winit = "0.30.13"
wgpu = { version = "30.0.1", default-features = false, features = ["gles", "metal", "wgsl"] }
